[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    security: OWASP security tests (Module 9 Lab 36)
    e2e: cross-layer end-to-end tests (Module 9 Lab 35)
    slow: tests that take more than a few seconds
