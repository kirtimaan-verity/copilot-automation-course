name: CI

# Referenced in Module 2 Lab 08 (created), Module 6 Lab 26 (matrix),
# Module 10 Lab 39 (hardening). This is the STARTING pipeline —
# students harden and extend it during the labs.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Node deps (workspaces)
        run: npm ci
      - name: Install test deps
        run: pip install -r requirements.txt
      - name: Seed database
        run: node db/seed.js --clean
      - name: Start API
        run: node api/server.js &
      - name: Wait for API
        run: sleep 3 && curl -s http://localhost:3001/health
      - name: Run API + DB tests
        # Exit code 5 = "no tests collected" — expected in the starter repo
        # until participants generate their tests; treat it as success.
        run: |
          rc=0
          API_BASE_URL=http://localhost:3001 \
          TEST_DB_URL=sqlite:///./db/app.db \
          pytest tests/api tests/db -v \
            --html=reports/api-report.html --self-contained-html \
            --junitxml=reports/api-results.xml \
            --cov=tests --cov-report=json:reports/coverage.json || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No tests collected yet (starter repo) — treating as pass."
            printf '%s\n' '{"totals":{"percent_covered":0}}' > reports/coverage.json
            exit 0
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/
          retention-days: 7

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Node deps (workspaces)
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web-app
      - name: Seed database
        run: node db/seed.js --clean
      - name: Start app + API
        run: |
          node api/server.js &
          (cd web-app && npm run dev &)
          sleep 5
      - name: Run Playwright tests
        # --pass-with-no-tests keeps the starter repo green until
        # participants generate their specs during the labs.
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob \
            --pass-with-no-tests
        working-directory: web-app
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-blob-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: web-app/blob-report/
          retention-days: 7

  merge-web-report:
    needs: [web-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Node deps (workspaces)
        run: npm ci
      - name: Download Playwright blob artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright blob reports into HTML
        run: npx playwright merge-reports --reporter html ../all-blob-reports
        working-directory: web-app
      - name: Merge Playwright blob reports into JSON
        run: npx playwright merge-reports --reporter json ../all-blob-reports > playwright-report/results.json
        working-directory: web-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: web-app/playwright-report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate workflow YAML
        run: |
          pip install yamllint
          yamllint .github/workflows/ || true

  summary:
    needs: [api-tests, web-tests, merge-web-report, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report status
        run: |
          {
            echo "## CI Summary"
            echo "- API tests: ${{ needs.api-tests.result }}"
            echo "- Web tests: ${{ needs.web-tests.result }}"
            echo "- Merged web report: ${{ needs.merge-web-report.result }}"
            echo "- Lint: ${{ needs.lint.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download API reports
        uses: actions/download-artifact@v4
        with:
          name: api-report
          path: reports
      - name: Download merged Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-merged
          path: web-app/playwright-report
      - name: Generate metrics summary line
        run: |
          metrics_line="$(python3 tools/generate-metrics.py)"
          echo "- Metrics: ${metrics_line}" >> "$GITHUB_STEP_SUMMARY"
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          API_RESULT: ${{ needs.api-tests.result }}
          WEB_RESULT: ${{ needs.web-tests.result }}
          MERGE_RESULT: ${{ needs.merge-web-report.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set. Skipping Discord notification."
            exit 0
          fi

          conclusion="success"
          if [ "$API_RESULT" != "success" ] || \
             [ "$WEB_RESULT" != "success" ] || \
             [ "$MERGE_RESULT" != "success" ] || \
             [ "$LINT_RESULT" != "success" ]; then
            conclusion="failure"
          fi

          CONCLUSION="$conclusion" python3 - <<'PY' > discord-payload.json
          import json
          import os

          icon = "✅" if os.environ["CONCLUSION"] == "success" else "❌"
          message = (
              f"{icon} **{os.environ['WORKFLOW_NAME']}** ({os.environ['CONCLUSION']}) in "
              f"`{os.environ['REPOSITORY']}` on `{os.environ['BRANCH_NAME']}` by `{os.environ['ACTOR']}`.\n"
              f"API: {os.environ['API_RESULT']} | Web: {os.environ['WEB_RESULT']} | "
              f"Merge: {os.environ['MERGE_RESULT']} | Lint: {os.environ['LINT_RESULT']}\n"
              f"Run: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"
          )
          print(json.dumps({"content": message}))
          PY

          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @discord-payload.json
